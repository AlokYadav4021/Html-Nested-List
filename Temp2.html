<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .main {
        height: 100vh;
        width: 100%;
        background-color: blue;
      }

      .head {
        height: 10vh;
        width: 100%;
        background-color: rgb(24, 150, 192);
      }

      .nav {
        height: 10vh;
        width: 100%;
        background-color: rgb(197, 17, 47);
      }

      .cont {
        height: 70vh;
        width: 100%;
        background-color: #1e4913;
      }

      .left {
        height: 100%;
        width: 50%;
        background-color: #0d8047;
        float: left;
      }

      .right {
        height: 100%;
        width: 50%;
        background-color: #0d5280;
        float: right;
      }

      .up {
        height: 50%;
        width: 100%;
        background-color: #940909;
      }

      .down {
        height: 50%;
        width: 100%;
        background-color: purple;
      }

      .left_left {
        height: 100%;
        width: 50%;
        background-color: #ffe207;
        float: left;
      }

      .left_right {
        height: 100%;
        width: 50%;
        background-color: #ce41db;
        float: right;
      }

      .foot{
        height: 10vh;
        width: 100%;
        background-color: #1a0250;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="head"></div>

      <div class="nav"></div>
      <div class="cont">
        <div class="left">
          <div class="up"></div>
          <div class="down"></div>
        </div>
        <div class="right">
          <div class="left_left"></div>
          <div class="left_right"></div>
        </div>
      </div>
      <div class="foot"></div>
    </div>
  </body>
</html>
