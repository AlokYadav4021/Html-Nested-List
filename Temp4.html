<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main{
            height: 100vh;
            width: 100%;
            background-color: red;
        }

        .head{
            height: 10vh;
            width: 100%;
            background-color: #027c62;
        }

        .nav{
            height: 10vh;
            width: 100%;
            background-color: #170c7a;
        }

        .cont{
            height: 70vh;
            width: 100%;
            background-color: #991621;
        }

        .foot{
            height: 10vh;
            width: 100%;
            background-color: #a7ff04;
        }

        .cont > div{
            height: 100%;
            width: 50%;
        }

        .left{
            background-color: #5730b1;
            float: left;
        }

        .right{
            background-color: #7c0950;
            float: right;
        }

        .left > div {
            height: 50%;
            width: 100%;
        }

        .up{
            background-color: #2c0505;

        }

        .down{
            background-color: #358355;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="head">

        </div>

        <div class="nav">

        </div>

        <div class="cont">
            <div class="left">
                <div class="up">

                </div>

                <div class="down">

                </div>
            </div>

            <div class="right">

            </div>
        </div>

        <div class="foot">

        </div>
    </div>
</body>
</html>
